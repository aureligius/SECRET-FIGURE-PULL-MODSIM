<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: transparent;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 320px;
      font-family: sans-serif;
      overflow: hidden;
    }
    #canvas-container { position: relative; }
  </style>
</head>
<body>
<div id="canvas-container"></div>
<script>
/*
  OPTION C ARCHITECTURE — Python runs ALL draw logic.
  This canvas is a pure one-way DISPLAY.

  URL params:
    ?state=idle|shaking|reveal|secret|empty
    &figure=Cherry+Blossom
    &emoji=🌸
    &is_secret=false
    &remaining=72
*/

function getParam(key, fallback) {
  const p = new URLSearchParams(window.location.search);
  return p.has(key) ? p.get(key) : fallback;
}

const STATE       = getParam("state",     "idle");
const FIGURE_NAME = decodeURIComponent(getParam("figure", ""));
const EMOJI       = decodeURIComponent(getParam("emoji",  "🎁"));
const IS_SECRET   = getParam("is_secret", "false") === "true";
const BOXES_LEFT  = parseInt(getParam("remaining", "72"), 10);

const FIGURE_COLORS = {
  "Cherry Blossom":  "#f7c5c5",
  "Mint Dream":      "#b8f0e6",
  "Lavender Haze":   "#d9c9f5",
  "Peach Glow":      "#ffd9b3",
  "Sky Pop":         "#c7eeff",
  "Coral Bloom":     "#ffb3c6",
  "Golden Labubu ✦": "#ffe566",
};

const CARD_COLOR = FIGURE_COLORS[FIGURE_NAME] || "#f0f0f0";

new p5(function(p) {
  let shakeFrame  = 0;
  let revealAlpha = 0;
  let sparkles    = [];
  let goldPulse   = 0;

  p.setup = function() {
    const cnv = p.createCanvas(520, 300);
    cnv.parent("canvas-container");
    p.textAlign(p.CENTER, p.CENTER);
    p.textFont("Georgia");

    if (STATE === "shaking") shakeFrame = 60;

    if (STATE === "secret" || (STATE === "reveal" && IS_SECRET)) {
      for (let i = 0; i < 30; i++) {
        sparkles.push({
          x:    p.random(p.width),
          y:    p.random(p.height),
          vx:   p.random(-2, 2),
          vy:   p.random(-3, -0.5),
          size: p.random(4, 10),
          life: 1.0,
          col:  p.random(["#ffe566","#fff8a0","#ffd700","#ffffff","#ff6b9d"]),
        });
      }
    }
  };

  p.draw = function() {
    p.clear();
    if      (STATE === "idle")    drawIdle();
    else if (STATE === "shaking") drawShaking();
    else if (STATE === "reveal")  drawReveal();
    else if (STATE === "secret")  drawSecret();
    else if (STATE === "empty")   drawEmpty();
  };

  // ── IDLE ─────────────────────────────────────────────
  function drawIdle() {
    const cx = p.width / 2, cy = p.height / 2 - 20;
    const pulse = p.sin(p.frameCount * 0.05) * 0.3 + 0.7;
    p.noStroke();
    p.fill(255, 107, 157, 40 * pulse);
    p.ellipse(cx, cy + 58, 110, 22);
    drawBox(cx, cy, 0);
    p.fill(100, 80, 140, 180);
    p.textSize(13);
    p.textStyle(p.NORMAL);
    p.text("← Click  Open 1 Box  or  Open Case  to pull", cx, p.height - 28);
    drawPill(`${BOXES_LEFT} boxes remaining in this batch`, cx, p.height - 8, "#8a7aaa", "#1c1630cc");
  }

  // ── SHAKING ───────────────────────────────────────────
  function drawShaking() {
    const cx = p.width / 2, cy = p.height / 2 - 20;
    const sx = p.random(-7, 7), sy = p.random(-3, 3);
    if (shakeFrame > 0) shakeFrame--;
    p.noStroke();
    p.fill(255, 107, 157, 60);
    p.ellipse(cx + sx, cy + 58, 120, 26);
    drawBox(cx + sx, cy + sy, p.sin(p.frameCount * 0.4) * 6);
    p.fill(100, 80, 140, 200);
    p.textSize(14);
    p.text("Opening...", cx, p.height - 28);
  }

  // ── REVEAL ────────────────────────────────────────────
  function drawReveal() {
    revealAlpha = p.min(revealAlpha + 8, 255);
    const cx = p.width / 2, cy = p.height / 2;
    p.noStroke();
    const cc = p.color(CARD_COLOR);
    p.fill(p.red(cc), p.green(cc), p.blue(cc), 60 * (revealAlpha / 255));
    p.ellipse(cx, cy, 260, 160);
    p.push();
    const scale = p.map(revealAlpha, 0, 255, 0.6, 1.0);
    p.translate(cx, cy); p.scale(scale); p.translate(-cx, -cy);
    drawRevealCard(cx, cy, revealAlpha);
    p.pop();
    updateSparkles();
  }

  // ── SECRET ────────────────────────────────────────────
  function drawSecret() {
    goldPulse  += 0.05;
    revealAlpha = p.min(revealAlpha + 6, 255);
    const cx = p.width / 2, cy = p.height / 2;
    const glow = p.sin(goldPulse) * 0.4 + 0.6;
    p.noStroke();
    p.fill(255, 229, 102, 80 * glow);
    p.ellipse(cx, cy, 300 + p.sin(goldPulse * 1.3) * 20, 200);
    p.fill(255, 215, 0, 30 * glow);
    p.ellipse(cx, cy, 380, 260);
    p.push();
    const scale = p.map(revealAlpha, 0, 255, 0.5, 1.0);
    p.translate(cx, cy); p.scale(scale); p.translate(-cx, -cy);
    drawSecretCard(cx, cy, revealAlpha);
    p.pop();
    if (p.frameCount % 3 === 0 && sparkles.length < 60) {
      sparkles.push({
        x: p.random(p.width), y: p.random(p.height),
        vx: p.random(-1.5, 1.5), vy: p.random(-3, -0.3),
        size: p.random(4, 12), life: 1.0,
        col: p.random(["#ffe566","#fff8a0","#ffd700","#ff6b9d","#ffffff"]),
      });
    }
    updateSparkles();
  }

  // ── EMPTY ─────────────────────────────────────────────
  function drawEmpty() {
    const cx = p.width / 2, cy = p.height / 2;
    p.noStroke();
    p.fill(80, 60, 120, 180);
    p.textSize(22); p.textStyle(p.BOLD);
    p.text("This batch is sold out 📦", cx, cy - 18);
    p.textSize(13); p.textStyle(p.NORMAL);
    p.fill(130, 110, 170, 160);
    p.text("Ask the admin to restock the factory batch.", cx, cy + 18);
  }

  // ── BOX ───────────────────────────────────────────────
  function drawBox(cx, cy, angle) {
    p.push();
    p.translate(cx, cy);
    p.rotate(p.radians(angle));
    p.stroke(224, 85, 154); p.strokeWeight(3);
    p.fill("#ff8fc8"); p.rectMode(p.CENTER);
    p.rect(0, 0, 96, 96, 10);
    p.fill("#ff6bb3");
    p.rect(0, -34, 108, 28, 7);
    p.noStroke(); p.fill(255, 229, 102, 210);
    p.rect(0, 0, 18, 96, 5);
    p.rect(0, -34, 108, 16, 5);
    p.fill("#ffd700");
    p.push(); p.rotate(p.radians(-20)); p.ellipse(-16, -42, 32, 16); p.pop();
    p.push(); p.rotate(p.radians(20));  p.ellipse(16,  -42, 32, 16); p.pop();
    p.stroke(224, 168, 0); p.strokeWeight(1.5);
    p.fill("#f6c94e"); p.circle(0, -42, 18);
    p.noStroke(); p.fill(255, 255, 255, 80);
    p.textSize(14); p.text("✦", -28, 18);
    p.textSize(11); p.text("◆",  28, -8);
    p.pop();
  }

  // ── REVEAL CARD ───────────────────────────────────────
  function drawRevealCard(cx, cy, alpha) {
    const cc = p.color(CARD_COLOR);
    p.fill(p.red(cc), p.green(cc), p.blue(cc), alpha * 0.85);
    p.stroke(255, 255, 255, alpha * 0.6); p.strokeWeight(2);
    p.rectMode(p.CENTER); p.rect(cx, cy, 230, 110, 18);
    p.noStroke(); p.fill(30, 20, 50, alpha);
    p.textSize(36); p.text(EMOJI, cx, cy - 18);
    p.textSize(17); p.textStyle(p.BOLD);
    p.text(FIGURE_NAME, cx, cy + 22);
    p.textSize(10); p.textStyle(p.NORMAL);
    p.fill(100, 80, 140, alpha * 0.8);
    p.text("Y O U  G O T", cx, cy - 50);
  }

  // ── SECRET CARD ───────────────────────────────────────
  function drawSecretCard(cx, cy, alpha) {
    p.noStroke();
    for (let i = 10; i >= 0; i--) {
      const t = i / 10;
      p.fill(p.lerp(255,255,t), p.lerp(200,229,t), p.lerp(50,102,t), alpha * 0.09);
      p.rectMode(p.CENTER); p.rect(cx, cy, 240+i*4, 120+i*3, 18+i);
    }
    p.fill(255, 229, 102, alpha * 0.92);
    p.stroke(255, 200, 0, alpha); p.strokeWeight(2.5);
    p.rect(cx, cy, 240, 120, 18);
    p.noStroke(); p.fill(30, 20, 0, alpha);
    p.textSize(38); p.text(EMOJI, cx, cy - 20);
    p.textSize(18); p.textStyle(p.BOLD);
    p.fill(100, 70, 0, alpha);
    p.text(FIGURE_NAME, cx, cy + 24);
    p.textSize(10); p.textStyle(p.NORMAL);
    p.fill(180, 120, 0, alpha);
    p.text("✦  U L T R A  S E C R E T  ✦", cx, cy - 54);
  }

  // ── SPARKLES ──────────────────────────────────────────
  function updateSparkles() {
    for (let i = sparkles.length - 1; i >= 0; i--) {
      const s = sparkles[i];
      s.x += s.vx; s.y += s.vy; s.vy += 0.05; s.life -= 0.018;
      if (s.life <= 0) { sparkles.splice(i, 1); continue; }
      p.noStroke();
      const sc = p.color(s.col);
      p.fill(p.red(sc), p.green(sc), p.blue(sc), 255 * s.life);
      p.circle(s.x, s.y, s.size * s.life);
    }
  }

  // ── PILL ──────────────────────────────────────────────
  function drawPill(txt, cx, y, textCol, bgCol) {
    p.textSize(11);
    const w = p.textWidth(txt) + 24;
    p.noStroke();
    p.fill(bgCol || "#1c163099");
    p.rect(cx - w/2, y - 11, w, 20, 10);
    p.fill(textCol || "#a090c0");
    p.textStyle(p.NORMAL);
    p.text(txt, cx, y);
  }
});
</script>
</body>
</html>
